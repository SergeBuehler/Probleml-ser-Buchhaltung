version: '3.9'

# Production overrides — use with:
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  db:
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/backup.sh:/backup.sh:ro
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  redis:
    restart: always

  backend:
    restart: always
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${DOMAIN},www.${DOMAIN}
      - CORS_ALLOWED_ORIGINS=https://${DOMAIN},https://www.${DOMAIN}
      - USE_S3=${USE_S3:-False}
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles

  celery:
    restart: always
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}

  frontend:
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=https://${DOMAIN}/api
    # In production, Next.js runs in standalone mode (see Dockerfile)

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    environment:
      - DOMAIN=${DOMAIN}
      - NGINX_ENVSUBST_TEMPLATE_SUFFIX=.conf
    depends_on:
      - backend
      - frontend
    command: >
      sh -c "envsubst '$$DOMAIN' < /etc/nginx/templates/default.conf.template
             > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"

volumes:
  postgres_data:
  media_files:
  static_files:
  certbot_webroot:
  certbot_certs:
